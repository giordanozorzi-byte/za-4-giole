<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gioca! · Zodiax Arena</title>
<meta name="description" content="Componi due mazzi e prova una sfida di Zodiax Arena, round per round.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app a schermo singolo per telefono. Due viste: composizione dei mazzi (tab Tu/Avversario) e arena (avversario in alto, tu in basso, comandi fissi in fondo). */
:root{
  --sky:#10172B; --sky-2:#07060F; --panel:#0B0E35; --panel-2:#1B2350; --line:#343C6B; --nav-h:70px; --gold-s:#EBCF93;
  --text:#F3EBDD; --muted:#B9B6CF;
  --gold:#E8B04B; --gold-deep:#9C6A1C; --ink-gold:#2A1405; --indaco:#2F57C2;
  --fuoco:#F2604A; --acqua:#6E95F0; --terra:#96A753; --aria:#B8A2A9;
  --atk:#FF5A4E; --def:#6E95F0; --ok:#7EE0A4; --bad:#FF6B7F;
  --f-display:"Cinzel",Georgia,serif; --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow-x:clip}
body{min-height:100vh;padding-top:var(--nav-h);background:radial-gradient(ellipse 900px 420px at 50% 0%,rgba(255,214,107,.08),rgba(255,214,107,0) 70%),linear-gradient(180deg,var(--sky) 0%,var(--panel) 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:.01em;color:#FFF8EC}
p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px)) 0 max(14px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* barra alta */
.top{position:sticky;top:var(--nav-h);z-index:19;background:linear-gradient(rgba(16,23,43,.97) 80%,rgba(16,23,43,0));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.top h1{font-size:1.15rem;color:var(--gold);flex:1;letter-spacing:.04em}
.pill{border:1.5px solid rgba(235,207,147,.55);background:var(--panel);border-radius:6px;padding:7px 12px;color:var(--gold-s);font:700 .78rem var(--f-display);letter-spacing:.1em;text-transform:uppercase}

/* composizione */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.tabs button{padding:10px;border-radius:8px;border:1.5px solid rgba(235,207,147,.3);background:var(--panel);font:700 1rem var(--f-display);letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button small{font-weight:600;font-size:.74rem;color:var(--muted)}
.tabs button[aria-selected=true]{border-color:var(--gold);background:var(--panel-2);color:#FFE7A0;box-shadow:0 0 18px -6px var(--gold)}
.tabs button .okk{color:var(--ok)} .tabs button .ko{color:var(--bad)}
.sec{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.sec h2{font-size:.78rem;font-family:var(--f-body);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.gods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.god{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:.78rem;font-weight:800}
.god img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 18%}
.god span{font-weight:600;font-size:.7rem}
.god[aria-pressed=true]{border-color:var(--gold);background:var(--panel-2)}
.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:center;min-width:0}
.slot .cap{font-size:.7rem;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .cap b{display:block;color:var(--text);font-size:.74rem}
.slot.bad .card{box-shadow:0 0 0 2px var(--bad)}
.card{position:relative;aspect-ratio:5/7;border-radius:5.5%;overflow:hidden;background:var(--panel);box-shadow:0 8px 22px #0008}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.cnt{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
.cnt.bad{border-color:var(--bad);color:var(--bad)}
.verdict{font-weight:700;font-size:.9rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.row{display:flex;gap:8px}
.btn{flex:1;padding:13px 12px;border-radius:8px;border:1.5px solid rgba(235,207,147,.55);background:var(--panel);color:var(--gold-s);font:700 .86rem var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.btn.primary{background:linear-gradient(180deg,#FFF0B3 0%,#E8B04B 55%,#B07A22 100%);color:var(--ink-gold);border-color:#B07A22;box-shadow:0 4px 12px rgba(0,0,0,.45);font-weight:800}
.btn.gold{background:linear-gradient(180deg,#FFF0B3 0%,#E8B04B 55%,#B07A22 100%);color:var(--ink-gold);border-color:#B07A22;box-shadow:0 4px 12px rgba(0,0,0,.45);font-weight:800;font-size:.95rem;letter-spacing:.12em}
.btn:disabled{opacity:.4;cursor:default}
.dock{position:sticky;bottom:0;z-index:10;background:linear-gradient(rgba(11,14,53,0),rgba(11,14,53,.96) 30%);padding:16px 0 calc(12px + env(safe-area-inset-bottom,0px))}

/* foglio di scelta */
.sheet{position:fixed;inset:0;z-index:40;background:#07060Fd8;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:min(520px,100%);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px max(14px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick button{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted)}
.pick button[aria-pressed=true] .card{box-shadow:0 0 0 3px var(--gold)}
.pick .v{font-weight:700;color:var(--text)}

/* arena */
.arena{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.side{display:grid;grid-template-columns:minmax(0,44%) 1fr;gap:12px;align-items:center}
.side.me{grid-template-columns:1fr minmax(0,44%)}
.side.me .info{order:-1;text-align:right;align-items:flex-end}
.slotc{position:relative;width:100%;max-width:max(110px,min(190px,calc((100svh - 430px)/2*5/7)));justify-self:center}
.side.me .slotc{justify-self:center}
.slotc .card{transition:filter .5s,opacity .5s,transform .5s}
.slotc .card.dead{filter:grayscale(1) brightness(.4);transform:scale(.93)}
.slotc .empty{aspect-ratio:5/7;border-radius:5.5%;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center;padding:8px}
.info{display:flex;flex-direction:column;gap:5px;min-width:0}
.who{font-family:var(--f-display);font-weight:700;font-size:.95rem;color:#FFE7A0;letter-spacing:.04em}
.who b{font-family:var(--f-body);color:var(--text);font-weight:900}
.bon{font-size:.7rem;color:var(--muted);line-height:1.3}
.pv{display:flex;flex-direction:column;gap:4px}
.pv .lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pv b{font-size:1.2rem;color:var(--text);letter-spacing:0}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:100%;max-width:200px}
.pips i{height:9px;border-radius:2px;background:var(--ok);transition:background .4s,opacity .4s}
.pips i.off{background:var(--line);opacity:.6}
.nm{font-size:.86rem;font-weight:700;line-height:1.2}
.stats{display:flex;gap:6px}
.side.me .stats{justify-content:flex-end}
.st{border-radius:10px;padding:3px 9px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.st.a{color:var(--atk)} .st.d{color:var(--def)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.side.me .chips{justify-content:flex-end}
.chip{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap}
.chip.hot{color:var(--ink-gold);background:var(--gold);border-color:var(--gold)}
.left{font-size:.75rem;color:var(--muted)}
.dmg{font-weight:900;font-size:1.1rem;color:var(--bad);min-height:1.3em;line-height:1.3;opacity:0;font-variant-numeric:tabular-nums}
.dmg.show{animation:dmg 1.4s ease-out forwards}
@keyframes dmg{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6%) rotate(-2deg)}45%{transform:translateX(5%) rotate(1.5deg)}70%{transform:translateX(-3%)}}
.vs{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.vs::before,.vs::after{content:"";flex:1;height:1px;background:var(--panel-2)}
.vs b{font-family:var(--f-display);color:var(--gold);font-size:.9rem}
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.86rem;display:flex;flex-direction:column;gap:4px;min-height:64px}
.log .r{color:var(--gold);font-weight:800;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.log p b{color:var(--text)}
.log p{color:var(--muted)}
details.hist{font-size:.82rem;color:var(--muted)}
details.hist summary{cursor:pointer;padding:6px 0}
details.hist p{padding:3px 0;border-top:1px solid var(--panel-2)}

/* fine partita */
.over{position:fixed;inset:0;z-index:30;background:#07060Fd0;display:flex;align-items:center;justify-content:center;padding:20px}
.over>div{width:min(420px,100%);background:var(--panel);border:1px solid var(--gold-deep);border-radius:20px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:12px}
.over h2{font-size:1.6rem;color:var(--gold)}

/* navbar comune a landing, regolamento, collezione e gioca */
.zn-head{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 32px;
background:linear-gradient(180deg,rgba(18,24,48,.9),rgba(10,15,34,.86));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:2px solid #E8B04B;box-shadow:0 -6px 0 -5px rgba(217,185,124,.45) inset}
.zn-brand{display:flex;align-items:center;gap:14px}
.zn-brand>a:first-child{flex:none}
.zn-brand>a:first-child img{height:52px;width:auto;display:block}
.zn-ghost{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1.5px solid rgba(235,207,147,.55);border-radius:6px;font:700 14px Cinzel,serif;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:#EBCF93;white-space:nowrap;transition:background .2s}
.zn-ghost:hover{background:rgba(235,207,147,.14)}
.zn-ghost[aria-current=page]{background:rgba(235,207,147,.16);border-color:#E8B04B;color:#FFE7A0}
.zn-ghost.zn-cta{border-color:#EBCF93;color:#FFE7A0}

/* menu a tendina su telefono e tablet */
.za-menu{display:none}
.za-menu summary{list-style:none;display:flex;flex-direction:column;justify-content:center;gap:5px;width:48px;height:48px;padding:0 12px;box-sizing:border-box;border:1.5px solid rgba(235,207,147,.55);border-radius:8px;background:rgba(11,14,53,.6);cursor:pointer}
.za-menu summary::-webkit-details-marker{display:none}
.za-menu summary:focus-visible{outline:2px solid #E8B04B;outline-offset:2px}
.za-menu summary span{display:block;height:2px;border-radius:2px;background:#FFE7A0;transition:transform .25s ease,opacity .2s ease}
.za-menu[open] summary{border-color:#E8B04B}
.za-menu[open] summary span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.za-menu[open] summary span:nth-child(2){opacity:0}
.za-menu[open] summary span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.za-menu-panel{position:absolute;left:0;right:0;top:100%;display:flex;flex-direction:column;padding:8px 20px 22px;background:rgba(10,15,34,.97);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:2px solid #E8B04B;box-shadow:0 24px 40px rgba(0,0,0,.55)}
.za-menu-panel a{display:block;padding:16px 4px;border-bottom:1px solid rgba(235,207,147,.18);font:700 16px Cinzel,serif;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:#EBCF93}
.za-menu-panel a[aria-current=page]{color:#FFE7A0}
.za-menu-panel a.za-menu-cta{margin-top:18px;padding:15px 4px;border:0;border-radius:8px;text-align:center;font-weight:800;color:#2A1405;background:linear-gradient(180deg,#FFF0B3 0%,#E8B04B 55%,#B07A22 100%);box-shadow:0 4px 12px rgba(0,0,0,.45)}
.za-menu-panel a.za-menu-login{padding:12px 4px 0;border:0;text-align:center;font:600 13px Nunito,sans-serif;letter-spacing:0;text-transform:none;color:#B9B6CF}
@media (prefers-reduced-motion: reduce){.za-menu summary span{transition:none}}
@media (max-width:860px){
.za-menu{display:block}
.zn-brand .zn-ghost,.zn-head>.zn-cta{display:none!important}
.zn-brand>a:first-child img{height:48px}
.zn-head{padding:8px 16px}
:root{--nav-h:66px}
}

/* desktop: composizione larga, arena con le creature affiancate e la cronaca a lato */
@media (min-width:1024px){
.wrap{max-width:1180px;padding:0 32px}
.top .wrap{padding-block:14px}
#setup{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:40px;align-items:start}
#setup>.tabs{grid-column:1/-1;max-width:520px}
#setup>.sec:has(#gods){grid-column:2;grid-row:2}
#setup>.sec:has(#deck){grid-column:1;grid-row:2/span 2}
#setup>.row{grid-column:2;grid-row:3;align-self:start}
#setup>.dock{grid-column:1/-1}
.deck{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.gods{grid-template-columns:repeat(2,1fr);gap:10px}
.god{flex-direction:row;justify-content:flex-start;gap:10px;padding:8px 10px;font-size:.9rem;text-align:left}
.god span{display:block}
.dock .btn.gold{max-width:420px;display:block;margin-left:auto}
.pick{grid-template-columns:repeat(6,1fr)}
.sheet{align-items:center}
.sheet>div{width:min(860px,100%);border-radius:20px}
.arena{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 340px;grid-template-rows:auto 1fr;column-gap:28px;row-gap:12px;align-items:start;padding-top:20px}
.side,.side.me{grid-template-columns:1fr;justify-items:center;text-align:center}
.side.me{grid-column:1;grid-row:1/span 2}
.vs{grid-column:2;grid-row:1/span 2;flex-direction:column;align-self:center;padding:0 4px}
.vs::before,.vs::after{width:1px;height:80px;flex:none}
.side.opp{grid-column:3;grid-row:1/span 2}
.side.me .info,.side .info{order:0;align-items:center;text-align:center}
.side.me .stats,.side.me .chips{justify-content:center}
.slotc{max-width:260px}
.pips{margin:0 auto}
#log{grid-column:4;grid-row:1}
details.hist{grid-column:4;grid-row:2}
#game>.dock .row{max-width:520px;margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dmg.show{opacity:1}}
</style>
</head>
<body>
<header class="zn-head">
<div class="zn-brand">
<a href="index.html" aria-label="Zodiax Arena, torna alla home"><img src="img/za-logo-compatto.webp" alt="Zodiax Arena"></a>
<a class="zn-ghost" href="regolamento.html">Regolamento</a>
<a class="zn-ghost" href="collezione.html">Collezione</a>
<a class="zn-ghost" href="gioca.html" aria-current="page">Gioca!</a>
</div>
<a class="zn-ghost zn-cta" href="index.html#iscriviti">Iscriviti</a>
<details class="za-menu"><summary aria-label="Menu"><span></span><span></span><span></span></summary><div class="za-menu-panel" role="navigation" aria-label="Menu"><a href="regolamento.html" onclick="this.closest('details').open=false">Regolamento</a><a href="collezione.html" onclick="this.closest('details').open=false">Collezione</a><a href="gioca.html" aria-current="page" onclick="this.closest('details').open=false">Gioca!</a><a class="za-menu-cta" href="index.html#iscriviti" onclick="this.closest('details').open=false">Iscriviti</a><a class="za-menu-login" href="index.html" onclick="this.closest('details').open=false">Hai già un account? Accedi</a></div></details>
</header>
<div class="top"><div class="wrap"><h1 id="title">Componi i mazzi</h1><button class="pill" id="backBtn" hidden>‹ Mazzi</button></div></div>

<!-- COMPOSIZIONE -->
<main class="wrap" id="setup">
  <div class="tabs" role="tablist">
    <button role="tab" id="tabA" aria-selected="true" data-s="0">Tu<small id="stA"></small></button>
    <button role="tab" id="tabB" aria-selected="false" data-s="1">Avversario<small id="stB"></small></button>
  </div>
  <div class="sec"><h2>Fazione</h2><div class="gods" id="gods"></div></div>
  <div class="sec">
    <h2>Mazzo · tocca una carta per cambiarne il segno</h2>
    <div class="deck" id="deck"></div>
    <div class="counts" id="counts"></div>
    <p class="verdict" id="verdict" aria-live="polite"></p>
  </div>
  <div class="row" style="margin-bottom:8px">
    <button class="btn" id="rndOne">Casuale questo mazzo</button>
    <button class="btn" id="rndAll">Casuali entrambi</button>
  </div>
  <div class="dock"><button class="btn gold" id="playBtn" style="width:100%">Inizia la sfida</button></div>
</main>

<!-- ARENA -->
<main class="wrap" id="game" hidden>
  <div class="arena">
    <div class="side opp">
      <div class="slotc" id="cardB"></div>
      <div class="info" id="infoB"></div>
    </div>
    <div class="vs"><b id="roundLbl">Round 1</b></div>
    <div class="side me">
      <div class="slotc" id="cardA"></div>
      <div class="info" id="infoA"></div>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <details class="hist"><summary>Cronaca completa</summary><div id="hist"></div></details>
  </div>
  <div class="dock"><div class="row">
    <button class="btn" id="endBtn">Fino alla fine</button>
    <button class="btn primary" id="stepBtn" style="flex:2">Combatti</button>
  </div></div>
</main>

<div id="sheet"></div>
<div id="over"></div>

<script>
const VS='︎';
const PL=['Sole','Luna','Marte','Giove','Saturno','Mercurio','Venere'];
const PORD=['Sole','Marte','Luna','Giove','Saturno','Mercurio','Venere'];
const PB={Sole:[9,8,'Leggendaria','☉'],Marte:[7,4,'Epica','♂'],Luna:[5,6,'Epica','☽'],Giove:[4,2,'Rara','♃'],Saturno:[2,4,'Rara','♄'],Mercurio:[2,0,'Comune','☿'],Venere:[0,2,'Comune','♀']};
const SG=['Ariete','Toro','Gemelli','Cancro','Leone','Vergine','Bilancia','Scorpione','Sagittario','Capricorno','Acquario','Pesci'];
const SB={Ariete:[13,7,'Fuoco','♈'],Toro:[8,12,'Terra','♉'],Gemelli:[0,0,'Aria','♊'],Cancro:[7,13,'Acqua','♋'],Leone:[12,8,'Fuoco','♌'],Vergine:[10,10,'Terra','♍'],Bilancia:[0,0,'Aria','♎'],Scorpione:[8,12,'Acqua','♏'],Sagittario:[10,10,'Fuoco','♐'],Capricorno:[12,8,'Terra','♑'],Acquario:[0,0,'Aria','♒'],Pesci:[10,10,'Acqua','♓']};
const ELS=['Fuoco','Acqua','Terra','Aria'];
const ELC={Fuoco:'var(--fuoco)',Acqua:'var(--acqua)',Terra:'var(--terra)',Aria:'var(--aria)'};
const BEATS={Acqua:'Fuoco',Fuoco:'Terra',Terra:'Aria',Aria:'Acqua'};
const GODS={Efesto:['Fuoco',2,0,'+2 ATK'],Poseidone:['Acqua',0,3,'+3 DEF'],Demetra:['Terra',1,1,'+1/+1'],Era:['Aria',1,1,'+1/+1']};
const $=id=>document.getElementById(id);
const g=s=>s+VS;
const imgOf=(p,s)=>`img/za-${String(PL.indexOf(p)*12+SG.indexOf(s)+1).padStart(3,'0')}-${p.toLowerCase()}-${s.toLowerCase()}.webp`;
const ascImg=s=>`img/za-asc-${String(SG.indexOf(s)+1).padStart(2,'0')}-ascendente-${s.toLowerCase()}.webp`;
const godImg=n=>`img/za-dio-${n.toLowerCase()}.webp`;
const di=e=>(e==='Acqua'||e==='Aria')?"d'"+e:'di '+e;
const card=(src,alt,cls='')=>`<div class="card ${cls}"><img src="${src}" alt="${alt}" decoding="async"></div>`;

/* ---------- mazzi ---------- */
const NAMES=['Tu','Avversario'];
const decks=[
  {god:'Efesto',asc:'Leone',signs:{Sole:'Leone',Marte:'Leone',Luna:'Pesci',Giove:'Sagittario',Saturno:'Capricorno',Mercurio:'Bilancia',Venere:'Toro'}},
  {god:'Poseidone',asc:'Scorpione',signs:{Sole:'Scorpione',Marte:'Scorpione',Luna:'Pesci',Giove:'Toro',Saturno:'Toro',Mercurio:'Leone',Venere:'Acquario'}}
];
let side=0;
const counts=d=>{const c=Object.fromEntries(ELS.map(e=>[e,0]));PORD.forEach(p=>c[SB[d.signs[p]][2]]++);return c};
const valid=d=>{const c=counts(d);return ELS.every(e=>c[e]>=1&&c[e]<=3)};
function randomDeck(){
  const godN=Object.keys(GODS)[Math.floor(Math.random()*4)];
  let signs;
  do{signs=Object.fromEntries(PORD.map(p=>[p,SG[Math.floor(Math.random()*12)]]))}while(!valid({signs}));
  const vals=Object.values(signs);
  const asc=Math.random()<.8?vals[Math.floor(Math.random()*7)]:SG[Math.floor(Math.random()*12)];
  return {god:godN,asc,signs};
}
function renderSetup(){
  const d=decks[side];
  ['A','B'].forEach((k,i)=>{$('tab'+k).setAttribute('aria-selected',i===side);$('st'+k).innerHTML=valid(decks[i])?`<span class="okk">✓ valido</span>`:`<span class="ko">da sistemare</span>`});
  $('gods').innerHTML=Object.entries(GODS).map(([n,G])=>`<button class="god" aria-pressed="${d.god===n}" data-g="${n}"><img src="${godImg(n)}" alt="">${n}<span style="color:${ELC[G[0]]}">${G[0]} ${G[3]}</span></button>`).join('');
  $('gods').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{d.god=b.dataset.g;renderSetup()});
  const c=counts(d);
  $('deck').innerHTML=PORD.map(p=>{const s=d.signs[p],e=SB[s][2];return `<button class="slot${c[e]>3?' bad':''}" data-p="${p}">${card(imgOf(p,s),p+' in '+s)}<span class="cap"><b>${p}</b><span style="color:${ELC[e]}">${g(SB[s][3])}</span> ${s}</span></button>`}).join('')+
    `<button class="slot" data-asc="1">${card(ascImg(d.asc),'Ascendente '+d.asc)}<span class="cap"><b>Ascendente</b>${g(SB[d.asc][3])} ${d.asc}</span></button>`;
  $('deck').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pickSign(b.dataset.p));
  $('deck').querySelector('[data-asc]').onclick=pickAsc;
  $('counts').innerHTML=ELS.map(e=>`<span class="cnt${c[e]<1||c[e]>3?' bad':''}" style="${c[e]>=1&&c[e]<=3?`color:${ELC[e]}`:''}">${e} ${c[e]}</span>`).join('');
  const bad=ELS.filter(e=>c[e]<1||c[e]>3),v=$('verdict');
  if(bad.length){v.className='verdict bad';v.textContent='Non valido: '+bad.map(e=>c[e]<1?`manca una carta ${di(e)}`:`troppe carte ${di(e)} (massimo 3)`).join('; ')+'.'}
  else{v.className='verdict ok';v.textContent='✓ Mazzo valido'}
  const okAll=valid(decks[0])&&valid(decks[1]);
  $('playBtn').disabled=!okAll;
  $('playBtn').textContent=okAll?'Inizia la sfida':`Sistema il mazzo ${valid(decks[0])?"dell'avversario":'tuo'}`;
}
function openSheet(html,onReady){
  const sh=$('sheet');sh.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div>${html}</div></div>`;
  const close=()=>{sh.innerHTML=''};
  sh.querySelector('.sheet').onclick=e=>{if(e.target.classList.contains('sheet'))close()};
  sh.querySelectorAll('.close').forEach(b=>b.onclick=close);
  onReady&&onReady(sh,close);
}
function pickSign(p){
  const d=decks[side];
  openSheet(`<h3>${p}: scegli il segno <button class="pill close">Chiudi</button></h3><p class="small muted">${PB[p][2]} · +${PB[p][0]} ATK, +${PB[p][1]} DEF</p><div class="pick">${SG.map(s=>{const e=SB[s][2];const v=e==='Aria'?'dadi':`${SB[s][0]+PB[p][0]}/${SB[s][1]+PB[p][1]}`;return `<button data-s="${s}" aria-pressed="${d.signs[p]===s}">${card(imgOf(p,s),p+' in '+s)}<span><span style="color:${ELC[e]}">${g(SB[s][3])}</span> ${s} · <span class="v">${v}</span></span></button>`}).join('')}</div>`,
    (sh,close)=>sh.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{d.signs[p]=b.dataset.s;close();renderSetup()}));
}
function pickAsc(){
  const d=decks[side];
  openSheet(`<h3>Ascendente <button class="pill close">Chiudi</button></h3><p class="small muted">+1 ATK alle carte del mazzo con lo stesso segno.</p><div class="pick">${SG.map(s=>`<button data-s="${s}" aria-pressed="${d.asc===s}">${card(ascImg(s),'Ascendente '+s)}<span>${g(SB[s][3])} ${s} · <span class="v">${PORD.filter(p=>d.signs[p]===s).length} carte</span></span></button>`).join('')}</div>`,
    (sh,close)=>sh.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{d.asc=b.dataset.s;close();renderSetup()}));
}
$('tabA').onclick=()=>{side=0;renderSetup()};
$('tabB').onclick=()=>{side=1;renderSetup()};
$('rndOne').onclick=()=>{decks[side]=randomDeck();renderSetup()};
$('rndAll').onclick=()=>{decks[0]=randomDeck();decks[1]=randomDeck();renderSetup()};

/* ---------- motore (Regolamento v2, set di lancio: tutte le carte in Casa I) ---------- */
let G=null;
const ri=n=>Math.floor(Math.random()*n);
const roll=()=>(ri(4)+ri(4)+2)*2;
function newGame(){
  G={pv:[10,10],pile:[0,1].map(i=>{const a=PORD.map(p=>({p,s:decks[i].signs[p]}));for(let k=a.length-1;k>0;k--){const j=ri(k+1);[a[k],a[j]]=[a[j],a[k]]}return a}),
     cur:[null,null],dead:[0,0],round:0,end:null,hist:[]};
  const L=[];for(const i of [0,1])L.push(spawn(i));
  G.hist.push({r:'Inizio',lines:['Le Moire mescolano i mazzi. Entrambi partite da 10 PV.',...L]});
  return {lines:G.hist[0].lines,enter:[true,true]};
}
function spawn(i){
  const c=G.pile[i].shift();const [sa,sd,el]=SB[c.s];const P=PB[c.p];const d=decks[i];
  let a=sa,df=sd,dice='';
  if(el==='Aria'){a=roll();df=roll();dice=` I dadi danno ${a} ATK e ${df} DEF.`}
  a+=P[0];df+=P[1];
  const chips=[];
  if(el==='Fuoco'){a+=1;chips.push('Fuoco +1 ATK')}
  if(el==='Acqua'){df+=1;chips.push('Acqua +1 DEF')}
  if(el==='Terra')chips.push('Terra −1 danno')
  if(c.s===d.asc){a+=1;chips.push('Ascendente +1 ATK')}
  const GG=GODS[d.god];
  if(GG[0]===el){a+=GG[1];df+=GG[2];chips.push(`${d.god} ${GG[1]?'+'+GG[1]+' ATK':''}${GG[1]&&GG[2]?' ':''}${GG[2]?'+'+GG[2]+' DEF':''}`)}
  df+=2;chips.push('Casa I +2 DEF');
  G.cur[i]={p:c.p,s:c.s,el,atk:a,def:df,max:df,chips,dead:false};
  return `<b>${NAMES[i]}</b> ${i?'schiera':'schieri'} <b>${c.p} in ${c.s}</b>: ATK ${a}, DEF ${df}.${dice}`;
}
function step(){
  if(G.end)return null;
  // se una creatura è caduta, prima entra la nuova carta
  if(!G.cur[0]||!G.cur[1]){
    const L=[],enter=[false,false];
    for(const i of [0,1])if(!G.cur[i]){L.push(spawn(i));enter[i]=true}
    G.hist.push({r:'Nuova carta',lines:L});
    return {lines:L,enter,phase:'enter'};
  }
  G.round++;
  const X=G.cur[0],Y=G.cur[1];
  const adv=[BEATS[X.el]===Y.el,BEATS[Y.el]===X.el];
  const att=[X.atk+(adv[0]?1:0),Y.atk+(adv[1]?1:0)];
  const before=[X.def,Y.def];
  X.def-=att[1];Y.def-=att[0];
  const kd=[X.def<=0,Y.def<=0];
  const L=[`Il tuo ${X.p} colpisce per <b>${att[0]}</b>${adv[0]?' (vantaggio +1)':''}; ${Y.p} dell'avversario per <b>${att[1]}</b>${adv[1]?' (vantaggio +1)':''}.`];
  const pvLoss=[0,0];
  if(kd[0]&&kd[1])L.push('Cadono entrambe nello stesso istante: nessuno perde PV.');
  else for(const i of [0,1])if(kd[i]){
    const me=G.cur[i];const raw=Math.max(0,att[1-i]-Math.max(0,before[i]));let x=raw;
    if(me.el==='Terra'&&x>0)x-=1;
    G.pv[i]=Math.max(0,G.pv[i]-x);pvLoss[i]=x;
    L.push(`${me.p} in ${me.s} cade. Danno in eccesso ${raw}${me.el==='Terra'&&raw>0?' − 1 (Terra)':''}: <b>${NAMES[i]}</b> ${i?'scende':'scendi'} a <b>${G.pv[i]} PV</b>.`);
  }
  if(!kd[0]&&!kd[1])L.push('Nessuna creatura cade: si combatte ancora.');
  for(const i of [0,1])if(kd[i]){G.cur[i].dead=true;G.dead[i]++}
  const snap=[{...X},{...Y}];
  const res={lines:L,dmg:att.slice().reverse(),kd,pvLoss,adv,snap,phase:'fight'};
  // fine partita
  if(G.pv[0]===0||G.pv[1]===0) G.end={w:G.pv[0]===0?1:0,how:'KO'};
  else{
    const exh=(kd[0]&&!G.pile[0].length)||(kd[1]&&!G.pile[1].length);
    if(exh||G.round>=30){
      const why=exh?'mazzo finito':'limite di 30 round';
      const al=[G.pile[0].length+(kd[0]?0:1),G.pile[1].length+(kd[1]?0:1)];
      const dv=[kd[0]?0:X.def,kd[1]?0:Y.def];
      if(G.pv[0]!==G.pv[1])G.end={w:G.pv[0]>G.pv[1]?0:1,how:`${why}: più PV`};
      else if(al[0]!==al[1])G.end={w:al[0]>al[1]?0:1,how:`${why}: più creature in vita`};
      else if(dv[0]!==dv[1])G.end={w:dv[0]>dv[1]?0:1,how:`${why}: più DEF residua`};
      else G.end={w:null,how:`${why}: parità totale`};
    }
  }
  for(const i of [0,1])if(kd[i])G.cur[i]=null;
  G.hist.push({r:'Round '+G.round,lines:L});
  return res;
}

/* ---------- arena ---------- */
function pipsHTML(pv){return Array.from({length:10},(_,i)=>`<i class="${i<pv?'':'off'}"></i>`).join('')}
function sideView(i,c){
  const k=i?'B':'A';
  $('card'+k).innerHTML=c?card(imgOf(c.p,c.s),`${c.p} in ${c.s}`,c.dead?'dead':''):`<div class="empty">Prossima carta dal mazzo</div>`;
  $('info'+k).innerHTML=`<div class="pv"><span class="who">${NAMES[i]} · <b>${G.pv[i]} PV</b></span><div class="pips">${pipsHTML(G.pv[i])}</div></div>
    ${c?`<span class="nm">${c.p} in ${c.s}${c.dead?' · <span style="color:var(--bad)">morta</span>':''}</span>
    <div class="stats"><span class="st a">ATK ${c.atk}</span><span class="st d">DEF ${Math.max(0,c.def)}</span></div>
    <span class="dmg" id="dmg${k}" aria-hidden="true"></span>
    <span class="bon">${c.chips.join(' · ')}</span>`:`<span class="dmg" id="dmg${k}" aria-hidden="true"></span>`}
    <span class="left">${G.pile[i].length} nel mazzo · ${G.dead[i]} cadute</span>`;
}
function hitFx(i,n){
  const k=i?'B':'A';const c=$('card'+k).querySelector('.card');
  if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  const d=$('dmg'+k);if(d){d.textContent='−'+n+' DEF';d.classList.remove('show');void d.offsetWidth;d.classList.add('show')}
}
function logView(res,label){
  $('log').innerHTML=`<span class="r">${label}</span>`+res.lines.map(l=>`<p>${l}</p>`).join('');
  $('hist').innerHTML=G.hist.slice().reverse().map(h=>`<p><b>${h.r}.</b> ${h.lines.join(' ')}</p>`).join('');
}
function render(res,anim){
  if(res&&res.phase==='fight'){
    for(const i of [0,1])sideView(i,res.snap[i]);
    $('roundLbl').textContent='Round '+G.round;
    logView(res,'Round '+G.round);
    if(anim)for(const i of [0,1])hitFx(i,res.dmg[i]);
  }else{
    for(const i of [0,1])sideView(i,G.cur[i]);
    $('roundLbl').textContent=G.round?'Round '+(G.round+1):'Round 1';
    logView(res,G.round?'Nuova carta':'Inizio');
  }
  const next=(!G.cur[0]||!G.cur[1])&&!G.end;
  $('stepBtn').textContent=G.end?'Risultato':next?'Nuova carta':'Combatti';
}
function showOver(){
  const w=G.end.w;
  $('over').innerHTML=`<div class="over" role="dialog" aria-modal="true"><div>
    <h2>${w===null?'Pareggio':w===0?'Vittoria!':'Sconfitta'}</h2>
    <p class="muted">${G.end.how==='KO'?'Per KO':'Per '+G.end.how}, dopo ${G.round} round. PV finali: tu ${G.pv[0]}, avversario ${G.pv[1]}.</p>
    <button class="btn gold" id="again">Rivincita</button>
    <div class="row"><button class="btn" id="edit">Modifica mazzi</button><button class="btn" id="seeEnd">Guarda il campo</button></div>
  </div></div>`;
  $('again').onclick=()=>{$('over').innerHTML='';start()};
  $('edit').onclick=()=>{$('over').innerHTML='';toSetup()};
  $('seeEnd').onclick=()=>{$('over').innerHTML=''};
}
let busy=false;
$('stepBtn').onclick=()=>{
  if(G.end){showOver();return}
  if(busy)return;
  const res=step();render(res,true);
  if(res.phase==='fight'){busy=true;setTimeout(()=>{busy=false;if(G.end)showOver()},G.end?1300:450)}
};
$('endBtn').onclick=()=>{
  if(G.end){showOver();return}
  let res,last=null;while(!G.end){res=step();if(res.phase==='fight')last=res}
  render(last||res,true);setTimeout(showOver,1300);
};
function start(){const r=newGame();render(r,false)}
function toSetup(){$('game').hidden=true;$('setup').hidden=false;$('backBtn').hidden=true;$('title').textContent='Componi i mazzi';renderSetup();window.scrollTo(0,0)}
$('playBtn').onclick=()=>{$('setup').hidden=true;$('game').hidden=false;$('backBtn').hidden=false;$('title').textContent='Zodiax Arena';start();window.scrollTo(0,0)};
$('backBtn').onclick=toSetup;
renderSetup();
</script>
</body>
</html>
